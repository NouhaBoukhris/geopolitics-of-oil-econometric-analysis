name: Temporary R validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-r-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::ggplot2
            any::plm
            any::lmtest
            any::stargazer
            any::forecast
      - name: Run analysis and validate generated outputs
        run: |
          Rscript src/analysis.R
          Rscript -e 'x <- read.csv("outputs/processed_panel.csv"); stopifnot(nrow(x)==468, length(unique(x$country))==12); y <- read.csv("outputs/arima_forecasts.csv"); stopifnot(nrow(y)==72, all(is.finite(y$forecast))); print(summary(y$forecast))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-validation-results
          path: outputs/
          if-no-files-found: ignore
